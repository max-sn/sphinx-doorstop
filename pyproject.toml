[project]
name = "sphinx-doorstop"
version = "0.1.0.dev0"
description = "A Sphinx extension allowing to include Doorstop documents and items in your Sphinx build."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "M.J.W. Snippe", email = "maxsnippe@gmail.com" }]
dependencies = [
  "docutils>=0.23",
  "doorstop>=3.2",
  "myst-parser>=5.2.0",
  "sphinx>=9.2.0",
]

[dependency-groups]
security = [
  "bandit>=1.9.4",
]
style = [
  "check-dependencies>=2.0.1",
  "ruff>=0.17.5",
]
test = [
  "packaging>=26.3",
  "pytest>=9.2.0",
]
test-runner = [
  "tox>=4.67.15",
  "tox-uv>=1.37.9",
]
type = [
  "ty>=0.0.107",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.tox]
requires = ["tox>=4", "tox-uv-bare>=1"]
env_list = [{ product = [["3.13"], ["test", "type"]] }, "style", "security"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = [
  { replace = "if", condition = "factor.test", then = "test", extend = true },
  { replace = "if", condition = "factor.type", then = "type", extend = true },
]
commands = [
  { replace = "if", condition = "factor.test", then = [["pytest"]], extend = true },
  { replace = "if", condition = "factor.type", then = [["ty", "check", "{posargs:src}"]], extend = true },
]

[tool.tox.env.style]
runner = "uv-venv-lock-runner"
description = "run style checking via ruff"
dependency_groups = ["style"]
commands = [["ruff", "check", "{posargs:src}"], ["check-dependencies", "--verbose", "{posargs:src}"]]

[tool.tox.env.security]
runner = "uv-venv-lock-runner"
description = "Run security scanning on code base"
dependency_groups = ["security"]
commands = [["bandit", "-r", "./src"]]
