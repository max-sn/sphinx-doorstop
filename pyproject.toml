[project]
name = "sphinx-doorstop"
version = "0.1.0"
description = "A Sphinx extension allowing to include Doorstop documents and items in your Sphinx build."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "M.J.W. Snippe", email = "maxsnippe@gmail.com" }]
dependencies = [
  "sphinx>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
style = [
    "ruff>=0.17.5",
]
type = [
    "ty>=0.0.107",
]
