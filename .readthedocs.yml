# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    build:
      html:
        - uv run --no-sync --no-dev sphinx-build --show-traceback --jobs 1 --builder html --doctree-dir _build/doctrees --define language=en ./docs/source $READTHEDOCS_OUTPUT/html


# Build documentation in the "docs/" directory with Sphinx
sphinx:
   configuration: docs/source/conf.py

python:
   install:
    - method: uv
      command: sync
      # groups: [docs]
